# Embedded Tomcat configuration (12-factor: port from environment)
server.port=${PORT:8080}
server.shutdown=graceful
spring.application.name=modresorts

# PostgreSQL datasource (HikariCP is the Spring Boot default pool)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:modresorts}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
