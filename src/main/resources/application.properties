# Externalized configuration for embedded Tomcat (Azure App Service sets PORT / WEBSITES_PORT)
server.port=${PORT:${WEBSITES_PORT:8080}}
server.servlet.context-path=/resorts
server.shutdown=graceful
server.servlet.session.timeout=30m

# PostgreSQL datasource (HikariCP pool)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:modresorts}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
