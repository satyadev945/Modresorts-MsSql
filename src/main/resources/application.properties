# Embedded Tomcat configuration (Azure App Service sets PORT / WEBSITES_PORT)
server.port=${PORT:${WEBSITES_PORT:8080}}
server.servlet.session.timeout=30m
server.shutdown=graceful

# PostgreSQL datasource (HikariCP)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
