# Embedded Tomcat port (12-factor: configurable via environment)
server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful

# PostgreSQL datasource (HikariCP is the default Spring Boot pool)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
