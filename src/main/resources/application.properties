# Externalized configuration (12-factor): override via environment variables
server.port=${PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/resorts}
server.servlet.session.timeout=30m
server.shutdown=graceful

# PostgreSQL datasource (override via environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
