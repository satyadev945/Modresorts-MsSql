version: "3.8"

services:
  modresorts:
    image: modresorts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modresorts
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - TZ=UTC
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
    volumes:
      - ./config:/app/config:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
