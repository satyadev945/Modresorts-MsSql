services:
  modresorts:
    image: modresorts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modresorts
    ports:
      - "9080:9080"
    environment:
      PORT: "9080"
      SPRING_PROFILES_ACTIVE: docker
      TZ: UTC
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m"
      WEATHER_API_KEY: "${WEATHER_API_KEY:-}"
      WEATHER_API_KEY_FILE: "${WEATHER_API_KEY_FILE:-}"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
