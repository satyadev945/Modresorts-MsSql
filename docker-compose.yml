version: "3.8"

services:
  modresorts:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    container_name: modresorts
    ports:
      - "9080:9080"
    environment:
      - TZ=UTC
      - PORT=9080
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Duser.timezone=UTC
      # External services (provided separately)
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_CACHE_TTL=${REDIS_CACHE_TTL:-300}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
    volumes:
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
