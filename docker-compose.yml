version: "3.8"

services:
  modresorts:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    container_name: modresorts
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - SERVER_NAME=${SERVER_NAME:-modresorts}
      - JNDI_INITIAL_CONTEXT_FACTORY=${JNDI_INITIAL_CONTEXT_FACTORY:-}
      - JNDI_PROVIDER_URL=${JNDI_PROVIDER_URL:-}
    volumes:
      - ./config:/app/config:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
