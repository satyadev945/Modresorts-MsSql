version: "3.8"

services:
  modresorts:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    container_name: modresorts
    ports:
      - "8080:8080"
    environment:
      TZ: "UTC"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
      WEATHER_SERVICE_URL: "${WEATHER_SERVICE_URL:-}"
      WEATHER_API_KEY: "${WEATHER_API_KEY:-}"
      SERVER_NAME: "${SERVER_NAME:-modresorts-local}"
      JNDI_INITIAL_CONTEXT_FACTORY: "${JNDI_INITIAL_CONTEXT_FACTORY:-}"
      JNDI_PROVIDER_URL: "${JNDI_PROVIDER_URL:-}"
    volumes:
      - app-logs:/usr/local/tomcat/logs
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  app-logs:
