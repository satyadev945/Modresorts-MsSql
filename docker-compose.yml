services:
  modresorts:
    image: modresorts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modresorts
    ports:
      - "9080:9080"
    environment:
      PORT: "9080"
      SPRING_PROFILES_ACTIVE: docker
      TZ: UTC
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m"
      WEATHER_API_KEY: "${WEATHER_API_KEY:-}"
      WEATHER_API_KEY_FILE: "${WEATHER_API_KEY_FILE:-}"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:15
    container_name: modresorts-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-modresorts}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
