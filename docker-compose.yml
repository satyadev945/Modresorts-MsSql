services:
  modresorts:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    container_name: modresorts
    ports:
      - "8080:8080"
    environment:
      TZ: "UTC"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
      # External services - provide via shell environment or an .env file
      WEATHER_API_KEY: "${WEATHER_API_KEY:-}"
      REDIS_HOST: "${REDIS_HOST:-}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CACHE_TTL_SECONDS: "${REDIS_CACHE_TTL_SECONDS:-60}"
      JNDI_INITIAL_CONTEXT_FACTORY: "${JNDI_INITIAL_CONTEXT_FACTORY:-}"
      JNDI_PROVIDER_URL: "${JNDI_PROVIDER_URL:-}"
      DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-modresorts}"
      DB_USER: "${POSTGRES_USER:-postgres}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-}"
    depends_on:
      - postgres
    volumes:
      - modresorts-logs:/opt/tomcat/logs
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: modresorts-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-modresorts}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
    volumes:
      - modresorts-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  modresorts-logs:
  modresorts-pgdata:
