version: "3.8"

services:
  modresorts:
    image: modresorts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modresorts
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=UTC
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - JMX_APPINFO_ENABLED=${JMX_APPINFO_ENABLED:-true}
      - SERVER_NAME=${SERVER_NAME:-modresorts}
      # External SQL Server (provided separately)
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}
    volumes:
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
