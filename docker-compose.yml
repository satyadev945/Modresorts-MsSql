version: "3.8"

services:
  modresorts:
    image: modresorts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modresorts
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Dfile.encoding=UTF-8 -Duser.timezone=UTC
      # Optional: real-time weather data. If empty, bundled default data is used.
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
    volumes:
      - modresorts-data:/home/app
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  modresorts-data:
