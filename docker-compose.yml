version: "3.8"

services:
  testcomp1:
    image: testcomp1:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testcomp1
    ports:
      - "8080:8080"
    environment:
      TZ: "UTC"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
      WEATHER_API_KEY: "${WEATHER_API_KEY:-}"
      SERVER_NAME: "${SERVER_NAME:-localhost}"
      JNDI_INITIAL_CONTEXT_FACTORY: "${JNDI_INITIAL_CONTEXT_FACTORY:-org.apache.naming.java.javaURLContextFactory}"
      JNDI_PROVIDER_URL: "${JNDI_PROVIDER_URL:-}"
    volumes:
      - app-logs:/usr/local/tomcat/logs
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  app-logs:
