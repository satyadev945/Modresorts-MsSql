# Cloud Build pipeline: purge unused CSS, build the image, push to Artifact Registry (deploy to GKE Autopilot).
steps:
  - id: purgecss
    name: node:20-alpine
    entrypoint: sh
    args:
      - -c
      - |
        npm install --no-save purgecss@6
        npx purgecss --config purgecss.config.js

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/modresorts:${SHORT_SHA}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/modresorts:${SHORT_SHA}

substitutions:
  _REGION: us-central1
  _REPOSITORY: modresorts

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/modresorts:${SHORT_SHA}
