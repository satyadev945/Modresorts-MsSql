apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresorts
  namespace: modresorts
  labels:
    app: modresorts
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresorts
  template:
    metadata:
      labels:
        app: modresorts
    spec:
      containers:
        - name: modresorts
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: WEATHER_API_KEY
              value: "{{WEATHER_API_KEY}}"
            - name: JMX_APPINFO_ENABLED
              value: "{{JMX_APPINFO_ENABLED}}"
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{SPRING_DATASOURCE_USERNAME}}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{SPRING_DATASOURCE_PASSWORD}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
