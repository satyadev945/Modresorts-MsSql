apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresorts
  namespace: modresorts
  labels:
    app: modresorts
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresorts
  template:
    metadata:
      labels:
        app: modresorts
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: modresorts
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Duser.timezone=UTC -Dfile.encoding=UTF-8 -Duser.home=/home/app"
            - name: WEATHER_API_KEY
              value: "{{WEATHER_API_KEY}}"
            - name: REMOTE_SERVICE_GRPC_TARGET
              value: "{{REMOTE_SERVICE_GRPC_TARGET}}"
            - name: SERVER_NAME
              value: "{{SERVER_NAME}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
