apiVersion: apps/v1
kind: Deployment
metadata:
  name: testcomp1
  namespace: testcomp1
  labels:
    app: testcomp1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testcomp1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: testcomp1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: testcomp1
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: WEATHER_API_KEY_NAME
              value: "WEATHER_API_KEY"
            - name: SERVER_DISPLAY_NAME
              value: "{{SERVER_DISPLAY_NAME}}"
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: testcomp1-weather-secret
                  key: WEATHER_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
