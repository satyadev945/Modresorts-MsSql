apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modresorts-ingress
  namespace: modresorts
  labels:
    app: modresorts
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modresorts-service
                port:
                  number: 80
